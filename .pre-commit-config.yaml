repos:
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.86.0
    hooks:
      - id: oxlint
        # survey.js is generated from survey.coffee
        exclude: ^survey\.js$
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.71.0
    hooks:
      - id: oxfmt
        exclude: ^survey\.js$
ci:
  autoupdate_schedule: weekly
